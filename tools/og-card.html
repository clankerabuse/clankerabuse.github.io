<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../assets/fonts/inter-var-latin.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../assets/fonts/mono-400-latin.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0b0b0c; color: #edebe6;
    font-family: 'Inter', sans-serif;
    position: relative; padding: 64px 72px;
    display: flex; flex-direction: column;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.075) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.075) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: radial-gradient(ellipse 85% 80% at 18% 0%, #000 8%, transparent 70%);
  }
  .glow {
    position: absolute; top: -260px; left: -180px; width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(226,180,95,.14), transparent 62%);
  }
  .top { display: flex; align-items: center; gap: 14px; position: relative; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px; background: #edebe6; color: #0b0b0c;
    display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 700;
  }
  .who { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .eyebrow {
    margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    letter-spacing: .1em; text-transform: uppercase; color: #a5a29b;
    display: flex; align-items: center; gap: 9px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6fe3a1; }
  h1 {
    position: relative; margin-top: auto;
    font-size: 70px; line-height: 1.03; letter-spacing: -0.038em; white-space: nowrap; font-weight: 600;
  }
  h1 span { display: block; color: #a5a29b; font-weight: 400; }
  .foot {
    position: relative; margin-top: 34px; display: flex; align-items: center; gap: 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #9a978f;
    letter-spacing: .02em; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.1);
  }
  .foot b { color: #e2b45f; font-weight: 400; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="top">
    <div class="mark">K</div>
    <div class="who">Kayne</div>
    <div class="eyebrow"><span class="dot"></span>Independent engineer · 2026</div>
  </div>
  <h1>Software that finishes the job<span>and shows its receipts.</span></h1>
  <div class="foot"><span><b>10</b> projects</span><span>Desktop · Web · Mobile · AI</span><span>clankerabuse.github.io</span></div>
</body>
</html>
